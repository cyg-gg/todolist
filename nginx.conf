server {
    listen 80;
    server_name localhost;

    # 前端静态资源
    location / {
        proxy_pass http://todolist-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 后端 API 请求
    location /api {
        proxy_pass http://todolist-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}