name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches: [main]

env:
  DEPLOY_DIR: /root/todolist

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. 拉取代码 ──────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. 将项目源码同步到 ECS ───────────────────────────────
      - name: Sync source code to ECS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ALIYUN_ECS_IP }}
          username: ${{ secrets.ALIYUN_ECS_USERNAME }}
          key: ${{ secrets.ALIYUN_ECS_SSH_KEY }}
          source: "docker-compose.yml,backend/,frontend/"
          target: "${{ env.DEPLOY_DIR }}"
          strip_components: 0

      # ── 3. SSH 到 ECS 执行部署 ───────────────────────────────
      - name: Deploy on ECS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_ECS_IP }}
          username: ${{ secrets.ALIYUN_ECS_USERNAME }}
          key: ${{ secrets.ALIYUN_ECS_SSH_KEY }}
          command_timeout: 600s
          script: |
            set -e
            cd ${{ env.DEPLOY_DIR }}

            echo "====== [1/5] 写入环境变量文件 ======"
            cat > .env << 'ENVEOF'
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            DB_HOST=mysql
            DB_PORT=3306
            DB_USER=root
            DB_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            DB_NAME=todolist
            PORT=3000
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            ENVEOF

            echo "====== [2/5] 停止旧容器 ======"
            docker compose down --remove-orphans 2>/dev/null || docker-compose down --remove-orphans 2>/dev/null || true

            echo "====== [3/5] 清理悬空镜像（节省磁盘）======"
            docker image prune -f

            echo "====== [4/5] 重新构建并启动所有容器 ======"
            if docker compose version &>/dev/null; then
              docker compose up -d --build
            else
              docker-compose up -d --build
            fi

            echo "====== [5/5] 健康检查 ======"
            echo "等待服务启动（30s）..."
            sleep 30

            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ 后端健康检查通过 (HTTP $HTTP_STATUS)"
            else
              echo "❌ 后端健康检查失败 (HTTP $HTTP_STATUS)"
              docker compose ps 2>/dev/null || docker-compose ps 2>/dev/null
              docker compose logs --tail=50 2>/dev/null || docker-compose logs --tail=50 2>/dev/null
              exit 1
            fi

            FRONT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80 || echo "000")
            if [ "$FRONT_STATUS" = "200" ]; then
              echo "✅ 前端健康检查通过 (HTTP $FRONT_STATUS)"
            else
              echo "⚠️  前端响应码 $FRONT_STATUS（非200，请手动确认）"
            fi

            echo "🚀 部署完成！访问地址：http://${{ secrets.ALIYUN_ECS_IP }}"
