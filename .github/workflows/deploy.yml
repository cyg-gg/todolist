name: Deploy to Alibaba Cloud

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload project to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,backend/,frontend/"
          target: "/root/todolist/"
          strip_components: 0

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/todolist

            # 生成 .env
            cat > /root/todolist/.env << 'ENVEOF'
            MYSQL_ROOT_PASSWORD='${{ secrets.MYSQL_ROOT_PASSWORD }}'
            DB_HOST=mysql
            DB_PORT=3306
            DB_USER=root
            DB_PASSWORD='${{ secrets.MYSQL_ROOT_PASSWORD }}'
            DB_NAME=todolist
            PORT=3000
            JWT_SECRET='${{ secrets.JWT_SECRET }}'
            VITE_API_BASE_URL=http://${{ secrets.SERVER_IP }}:3000/api
            ENVEOF

            # 构建并启动容器
            docker-compose down 2>/dev/null || true
            docker image prune -f
            docker-compose up -d --build

            # 健康检查
            sleep 20
            curl -sf http://localhost:3000/health || { echo "Health check failed"; exit 1; }
            echo "Deployment successful"