name: Deploy to Alibaba Cloud

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/root/todolist/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p /root/todolist
            cd /root/todolist

            # 生成 .env
            cat > /root/todolist/.env << 'ENVEOP'
            MYSQL_ROOT_PASSWORD='${{ secrets.MYSQL_ROOT_PASSWORD }}'
            DB_HOST=mysql
            DB_PORT=3306
            DB_USER=root
            DB_PASSWORD='${{ secrets.MYSQL_ROOT_PASSWORD }}'
            DB_NAME=todolist
            PORT=3000
            JWT_SECRET='${{ secrets.JWT_SECRET }}'
            VITE_API_BASE_URL=http://${{ secrets.SERVER_IP }}:3000/api
            ENVEOP

            # 重启容器
            docker-compose down 2>/dev/null || true
            docker-compose up -d

            sleep 15
            curl -sf http://localhost:3000/health || { echo "Health check failed"; exit 1; }
            echo "Deployment successful"
