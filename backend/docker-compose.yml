services:
  mysql:
    image: mysql:8.0
    container_name: todolist-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: todolist
    ports:
      - "3306:3306"
    volumes:
      - todolist-mysql-data:/var/lib/mysql

  backend:
    build: .
    container_name: todolist-backend
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - mysql

volumes:
  todolist-mysql-data:
